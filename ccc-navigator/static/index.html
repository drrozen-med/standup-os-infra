*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.4 var(--sans);-webkit-font-smoothing:antialiased;display:flex;overflow:hidden}
button{font:inherit;color:inherit}
input{font:inherit}
input::placeholder{color:var(--dim)}
:focus-visible{outline:2px solid var(--primary-hi);outline-offset:1px}
button,.dots,.eye{transition:background .12s,color .12s,border-color .12s,opacity .12s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#side{width:400px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
.top{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;justify-content:space-between}
.brand{font:700 15px var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.brand::before{content:"";width:18px;height:18px;border-radius:6px;background:linear-gradient(135deg,var(--primary-hi),var(--primary));box-shadow:0 0 0 1px var(--line2),0 3px 10px var(--primary-soft)}
.seg{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;border-radius:6px;padding:4px 9px;font-size:11.5px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--primary-fg);box-shadow:0 1px 4px var(--primary-soft)}
.seg button:not([aria-pressed=true]):hover{color:var(--text);background:var(--hover)}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:0 10px;height:34px}
.search:focus-within{border-color:var(--primary-hi);box-shadow:0 0 0 3px var(--primary-soft)}
.search input{flex:1;background:transparent;border:0;outline:none;color:var(--text)}
.kbd{font:11px var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:0 4px}
.status{font-size:11px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
.status .bad{color:var(--accent)}

#pinned{display:flex;flex-direction:column;gap:2px;padding:2px 8px 6px;border-bottom:1px solid var(--line)}
.pin-row{display:flex;align-items:center;gap:8px;width:100%;text-align:start;background:transparent;border:0;border-radius:8px;padding:9px 10px;color:var(--text);font-size:13.5px;font-weight:600;cursor:pointer;min-height:36px}
.pin-row:hover{background:var(--line2)}.pin-row:focus-visible{outline:2px solid var(--primary-hi);outline-offset:-2px}
.pin-row[aria-current="true"]{background:var(--primary-soft)}
.pin-row .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pin-row .ps{margin-inline-start:auto;font-size:11.5px;font-weight:400;color:var(--dim);white-space:nowrap}
.pin-row .n{background:var(--accent);color:var(--bg);border-radius:999px;font-size:11px;padding:0 7px;line-height:18px}
.pin-row.dec:not(.has) .pn{color:var(--muted)}
#list{flex:1;overflow-y:auto;padding:4px 0 12px;min-height:0}
#list::-webkit-scrollbar{width:8px}#list::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:4px}
.repo-h{width:100%;display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--panel);border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left;position:sticky;top:0;z-index:3}
.repo-h:hover{background:var(--hover)}
.repo-h .name{font:700 13.5px var(--display);letter-spacing:-.005em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{flex:none;transition:transform .12s}
.open>.repo-h .chev,.open>.grp-h .chev{transform:rotate(90deg)}
.livec{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11.5px;font-weight:600}
.livec.compact{display:none;align-items:center;gap:6px}
.livec.compact .pair{display:flex;align-items:center;gap:3px}
.livec.compact .num{font-size:11px}
@media (max-width:480px){.livec.full{display:none}.livec.compact{display:flex}}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--idle)}
.dot.working{background:var(--live);box-shadow:0 0 0 3px color-mix(in oklab,var(--live) 20%,transparent);animation:dot-pulse 2.4s ease-in-out infinite}
.dot.needs-you{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dot.dormant{opacity:.45}
@keyframes dot-pulse{50%{box-shadow:0 0 0 5px color-mix(in oklab,var(--live) 8%,transparent)}}
@media(prefers-reduced-motion:reduce){.dot.working{animation:none}}
.cnt{color:var(--muted);font-size:11.5px;min-width:18px;text-align:right}
.grp-h{width:100%;display:flex;align-items:center;gap:6px;padding:5px 16px 5px 34px;background:transparent;border:0;cursor:pointer;text-align:left;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.grp-h:hover{background:var(--hover)}
.grp-h .gname{color:var(--text2)}
.grp-h .gname.none{color:var(--dim);font-style:italic}
.ungrouped .s{padding-left:34px}
.ungrouped.drop{background:var(--primary-soft);outline:1px dashed var(--primary-hi);outline-offset:-2px}
.grp-h.drop{background:var(--primary-soft);outline:1px dashed var(--primary-hi);outline-offset:-2px}
.tag{font-size:9.5px;letter-spacing:.4px;padding:0 5px;border-radius:3px;line-height:15px;font-weight:700;text-transform:uppercase}
.tag.orca{color:var(--info);background:color-mix(in oklab,var(--info) 15%,transparent)}
.items{display:none}.open>.items{display:block}
.groups{display:none}.open>.groups{display:block}
.s{width:100%;display:flex;align-items:center;gap:10px;padding:7px 16px 7px 50px;border:0;cursor:pointer;text-align:left;background:transparent}
.s:hover{background:var(--hover)}
.s[aria-current=true]{background:var(--sel);box-shadow:inset 2px 0 0 var(--sel-bar)}
.s .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.s .t{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s .t.nick{font-weight:700;color:var(--text)}
.s .meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden}
.s .wt{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis}
.s .you{color:var(--accent);font-weight:600}
.tri{font-weight:600}.tri.needs-you{color:var(--accent)}.tri.blocked{color:var(--danger)}.tri.done{color:var(--live)}.tri.stale{color:var(--dim)}
.note-m{color:var(--info)}
.overview .hint{color:var(--dim);font-size:12px;margin:0}
.ovbtn{display:inline-flex;vertical-align:middle;margin-left:8px;width:16px;height:16px;align-items:center;justify-content:center;border-radius:4px;color:var(--dim);opacity:.55;cursor:pointer}.ovbtn:hover{opacity:1;background:var(--line2)}.ovbtn svg{width:12px;height:12px}
.ovline{font-size:10.5px;color:var(--dim);padding:0 2px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ovline[hidden]{display:none}
#focusBar{padding:8px 14px;border-bottom:1px solid var(--line);background:var(--accent-soft);display:flex;flex-direction:column;gap:4px}
#focusBar .ft{display:flex;flex-direction:column;gap:2px;font-size:12px}#focusBar .ft span{color:var(--muted);font-size:11px}
#focusBar .fb{display:flex;gap:12px}
#focusBar[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast{display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px)}
#toast button{background:transparent;border:0;color:var(--accent);font:700 12.5px var(--font,inherit);cursor:pointer;padding:2px 0;text-transform:uppercase;letter-spacing:.04em}
/* left side menu */
.menubtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin:0 6px 0 -4px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;vertical-align:middle}
.menubtn:hover{background:var(--line2);color:var(--text)}
.menubtn .upd{position:absolute;margin:-14px 0 0 14px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
#drawerScrim{position:fixed;inset:0;background:oklch(0 0 0/35%);z-index:90;opacity:0;pointer-events:none;transition:opacity .15s}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(280px,84vw);background:var(--panel);border-right:1px solid var(--line);z-index:91;transform:translateX(-100%);transition:transform .18s ease;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 16px 16px;gap:4px}
body.drawer-open #drawer{transform:none}body.drawer-open #drawerScrim{opacity:1;pointer-events:auto}
#drawer h3{margin:0 0 10px;font-size:15px}
#drawer .dv{font-size:11.5px;color:var(--dim);margin-bottom:10px;line-height:1.5}
#drawer button.it{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:11px 10px;color:var(--text);font-size:14px;cursor:pointer}
#drawer button.it:hover{background:var(--line2)}
#drawer button.it.hl{color:var(--accent);font-weight:700}
#drawer .rh{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
#drawer .rht{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 2px 6px}
#drawer .hl-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 2px;font-size:13px;color:var(--text)}
#drawer .hl-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#drawer .hl-row i{font-style:normal;color:var(--dim);font-size:11px;margin-left:6px}
#drawer .hl-row button{flex:none;background:transparent;border:1px solid var(--line2);border-radius:6px;color:var(--accent);font-weight:700;font-size:12px;padding:4px 10px;cursor:pointer}
#drawer .hint{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:auto;padding:8px 2px}
.s .ago{color:var(--dim);font-size:11px;flex:none}
.v-off-orca .grp-h .tag.orca{display:none}
.v-off-wt .s .wt{display:none}
.v-off-eng .s>.eng{display:none}
.v-off-ago .s .ago{display:none}
.v-off-cnt .cnt{display:none}
.v-off-livec .livec{display:none}
.v-off-livec .livec.compact{display:none}
.v-off-status #status{display:none}
.v-off-status #status:has(.bad){display:flex}
.tag.orca{background:transparent;font-size:13px;padding:0;line-height:1}
.chip.view{margin-left:auto}
.inbox h2{font:700 18px var(--display);margin:0;display:flex;gap:8px;align-items:center}.inbox h2 .n{color:var(--dim);font-size:14px}
.dcard{border:1px solid var(--line2);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.dmeta{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--dim)}
.pri{font-weight:800;border-radius:6px;padding:1px 6px;background:var(--hover)}.pri.p1{color:var(--accent)}
.due{margin-left:auto}.due.soon{color:var(--accent);font-weight:700}
.dq{font-size:14px;line-height:1.5;unicode-bidi:plaintext;text-align:start}
.dopts{display:flex;flex-wrap:wrap;gap:8px}
.dopt{min-height:36px;padding:6px 14px;border-radius:10px;border:1px solid var(--line3);background:transparent;color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
.dopt:hover{background:var(--primary-soft);border-color:var(--primary-hi)}.dopt.other{color:var(--muted)}
.dsrc{font-size:11px;color:var(--dim)}
.dlg{position:fixed;inset:0;z-index:200;background:oklch(0 0 0/50%);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg-box{width:min(440px,100%);max-height:80vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px oklch(0 0 0/40%)}
.dlg-t{font:700 15px var(--display);color:var(--text)}.dlg-h{font-size:12px;color:var(--dim);line-height:1.5}
.dlg-box input,.dlg-box textarea{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid var(--line3);background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);padding:10px 12px;min-height:40px;unicode-bidi:plaintext;text-align:start}
.dlg-box input:focus,.dlg-box textarea:focus{outline:none;border-color:var(--primary-hi)}
.dlg-b{display:flex;justify-content:flex-end;gap:10px}
.dlg-b button{min-height:38px;padding:6px 16px;border-radius:10px;border:1px solid var(--line3);background:transparent;color:var(--text);font-weight:600;cursor:pointer}
.dlg-b .dlg-ok{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}.dlg-b .dlg-ok.danger{background:var(--bad,#c0392b);border-color:var(--bad,#c0392b)}
.dlg-notes{display:flex;flex-direction:column;gap:10px}.dlg-note{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px;font-size:13px}.dlg-note .linkbtn{align-self:flex-start}
.dother{display:flex;flex-direction:column;gap:8px}
.dother textarea{width:100%;box-sizing:border-box;min-height:64px;resize:vertical;border-radius:10px;border:1px solid var(--line3);background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);padding:10px 12px;unicode-bidi:plaintext;text-align:start}

<body>
<nav id="side" aria-label="Sessions">
  <div class="top">
    <div class="row1">
      <div style="display:flex;align-items:center"><button type="button" class="menubtn" id="menuBtn" aria-label="Menu" title="Menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="upd" id="updDot" hidden></span></button><div class="brand">Sessions<span class="ovbtn" id="ovBtn" role="button" tabindex="0" title="Show or hide the summary line" aria-label="Show or hide the summary line"></span></div></div>
      <div class="tools"><button type="button" class="iconbtn" id="theme" title="Theme: auto / light / dark" aria-label="Toggle theme"></button><button type="button" class="iconbtn" id="foldAll" title="Collapse all / expand all" aria-label="Collapse all or expand all"></button><div class="seg" id="win" role="group" aria-label="Time window"></div></div>
    </div>
    <div class="ovline" id="ovLine"></div>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="sr">Search sessions</span>
      <input id="q" type="text" dir="auto" placeholder="Search nickname, title, repo, group…" autocomplete="off">
      <span class="kbd" aria-hidden="true">/</span>
    </label>
    <div class="status" id="status"></div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="focusBar" hidden></div>
  <div id="pinned"></div>
  <div id="list" role="tree"></div>
  <div class="foot">
    <div class="frow"><div class="fleft"><span id="hiddenTxt"></span></div><button class="btn" id="hiddenBtn" type="button">Show</button></div>
    <div class="frow"><div class="fleft"><span id="mineTxt"></span></div><button class="btn" id="mineBtn" type="button">Show</button></div>
  </div>
</nav>
<main id="main"></main>
<div id="drawerScrim"></div>
<aside id="drawer" aria-label="Menu"></aside>

<script>
(() => {
  const CHEV = '<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  const CARET = '<svg class="caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  const BRANCH = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>';
  const EYE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5.5 19 2 12 2 12a18 18 0 0 1 5-5.9M9.9 5.2A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M1 1l22 22"/></svg>';
  const FOLD = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg>';
  const DOTS = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
  const STAR = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.8 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>';
  const STAR_ON = STAR.replace('fill="none"', 'fill="currentColor"');
  const EMOJI = '🚀 🏥 ⚡ 🔥 🧪 🧠 🛠️ 📦 🎯 🧹 🗂️ 📚 💬 🔒 💰 🌱 🐛 ✅ ⭐ 🧭 🎨 📈 ☁️ 🤖 🩺 💊 🧬 🎓 📱 🌐 🔔 🧾 🧯 🏗️ 🛰️ 🔬 📝 🎧 🗺️'.split(' ');
  const WINS = [['now', 'Now'], ['1d', '1d'], ['7d', '7d'], ['all', 'All']];
  const ENGINES = new Set(['claude', 'codex', 'devin', 'pi']);

  const store = {
    get(k, d) { try { const v = localStorage.getItem('ccc-nav-' + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
    set(k, v) { try { localStorage.setItem('ccc-nav-' + k, JSON.stringify(v)); } catch (_) {} },
  };
  const ui = {
    win: store.get('win', '1d'),
    collapsed: store.get('collapsed', {}),
    selected: store.get('selected', null),
    pane: store.get('pane', 'chat'),
    showHidden: false,
    view: Object.assign({ orca: true, wt: false, eng: true, ago: true, cnt: true, livec: true, status: false }, store.get('view', {})),
    f: store.get('filters', { star: false, live: false, needs: false }),
    showMine: store.get('showMine', false),
    query: '',
    ov: store.get('ov', true),
    focus: null,  // {repo, group, path}: show everything in one workspace, all time, hidden included
  };
  let tree = null, flat = [], lastDetailKey = null, inflight = false, chatInst = null;
  let decs = { open: [], answered: [] }, decSig = '';

  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ago = (t) => { if (!t) return ''; const m = Math.max(0, (Date.now() / 1000 - t) / 60); if (m < 1) return 'now'; if (m < 60) return Math.floor(m) + 'm'; if (m < 1440) return Math.floor(m / 60) + 'h'; return Math.floor(m / 1440) + 'd'; };
  const agoLong = (t) => { const a = ago(t); return a === 'now' ? 'just now' : a + ' ago'; };
  const label = (s) => s.nick || s.original;

  async function post(path, body) {
    await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    await refresh(true);
  }

  async function refresh(force) {
    if (inflight && !force) return;
    inflight = true;
    try {
      const r = await fetch('/api/tree?window=' + encodeURIComponent(ui.focus ? 'all' : ui.win) + (ui.showMine || ui.focus ? '&hidden=1' : ''));
      tree = await r.json();
      await loadDecisions();
      render();
    } catch (e) {
      $('#status').innerHTML = '<span class="bad">Navigator server unreachable</span>';
    } finally { inflight = false; }
  }

  async function loadDecisions() {
    try {

  // ---- decision inbox: what only Uri can decide, answered with one tap
  const PRI = { 1: 'P1', 2: 'P2', 3: 'P3' };
  function due(d) {
    if (d.days_left === null || d.days_left === undefined) return '';

    return `<span class="due ${d.days_left <= 3 ? 'soon' : ''}">${t}</span>`;
  }
  function inboxHtml() {
    const card = (d, showWhy) => `<div class="dcard" data-dec="${esc(d.id)}">
        <div class="dmeta"><span class="pri p${esc(d.priority || 3)}">${PRI[d.priority] || 'P3'}</span><span class="lane">${esc(d.lane || '')}</span>${d.rank ? `<span class="pri">#${esc(d.rank)}</span>` : ''}${due(d)}</div>
        <div class="dq" dir="auto">${esc(d.question)}</div>
        ${showWhy && d.why ? `<div class="dsrc">${esc(d.why)}</div>` : ''}
        <div class="dopts">${(d.options || []).filter(o => String(o).toLowerCase() !== 'other').map(o => `<button type="button" class="dopt" data-ans="${esc(d.id)}" data-choice="${esc(o)}" dir="auto">${esc(o)}</button>`).join('')}<button type="button" class="dopt other" data-other="${esc(d.id)}">Other…</button></div>
        <div class="dother" hidden><textarea dir="auto" rows="2" placeholder="Your answer… (Enter sends, Shift+Enter new line)"></textarea><div class="drow"><button type="button" class="dopt dsend" data-send="${esc(d.id)}">Send</button><button type="button" class="linkbtn" data-cancel>Cancel</button></div></div>
        ${d.source || d.session ? `<div class="dsrc">${esc(d.source || '')}${d.session ? ' · reply goes to the asking agent' : ''}</div>` : ''}
      </div>`;
    const done = decs.answered.map(d => `<div class="dans"><span class="dq" dir="auto">${esc(d.question)}</span><span class="dpick" dir="auto">→ ${esc(d.answer.choice)}${d.answer.note ? ': ' + esc(d.answer.note) : ''}</span><button type="button" class="linkbtn" data-reopen="${esc(d.id)}">Reopen</button></div>`).join('');

    return `<div class="detail inbox"><button type="button" class="mback" data-mback>‹ Sessions</button>
      <h2>Decisions <span class="n">${decs.open.length}</span></h2>
      ${body}

    </div>`;
  }
  async function answerDecision(id, choice, note = '') {

  /* Pinned at the top, not filtered and not movable: the Co-pilot chat, and the Decisions page. */

  const isFocusGroup = g => ui.focus && (g.name === ui.focus.group || (ui.focus.path && g.orca_path === ui.focus.path));
  function wsUrl(repoKey, g) {

  function toast(msg, action) {   // action: {label, fn, sticky}
    let t = $('#toast');
    if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
    t.innerHTML = '';
    t.appendChild(document.createTextNode(msg));
    if (action) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label;
      b.onclick = () => { t.classList.remove('on'); action.fn(); };

  /* In-page dialogs. The browser's prompt()/confirm() are blocked in embedded browsers (the app pane,

  function dialog(build) {
    return new Promise(resolve => {
      const scrim = document.createElement('div');
      scrim.className = 'dlg';
      scrim.innerHTML = '<div class="dlg-box" role="dialog" aria-modal="true"></div>';
      const box = scrim.firstChild;
      const prev = document.activeElement;
      const close = v => { scrim.remove(); document.removeEventListener('keydown', onKey, true); if (prev && prev.focus) prev.focus(); resolve(v); };
      const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); close(null); } };
      document.addEventListener('keydown', onKey, true);
      scrim.addEventListener('click', e => { if (e.target === scrim) close(null); });
      document.body.appendChild(scrim);
      build(box, close);
    });

  function askText({ title, value = '', placeholder = '', hint = '', multiline = false, ok = 'Save', readonly = false }) {

      box.innerHTML = `<div class="dlg-t" dir="auto">${esc(title)}</div>${hint ? `<div class="dlg-h">${esc(hint)}</div>` : ''}${field}
        <div class="dlg-b"><button type="button" class="dlg-x">${readonly ? 'Close' : 'Cancel'}</button>${readonly ? '' : `<button type="button" class="dlg-ok">${esc(ok)}</button>`}</div>`;
      const f = box.querySelector('input,textarea');
      f.value = value; f.placeholder = placeholder; f.dir = 'auto'; f.readOnly = readonly;
      box.querySelector('.dlg-x').addEventListener('click', () => close(null));
      const okb = box.querySelector('.dlg-ok'); if (okb) okb.addEventListener('click', () => close(f.value));
      f.addEventListener('keydown', e => { if (e.key === 'Enter' && !readonly && (!multiline || !e.shiftKey) && !e.isComposing) { e.preventDefault(); close(f.value); } });
      setTimeout(() => { f.focus(); f.select(); }, 0);
    });
  }
  function askConfirm(title, text, ok = 'OK') {

        <div class="dlg-b"><button type="button" class="dlg-x">Cancel</button><button type="button" class="dlg-ok danger">${esc(ok)}</button></div>`;
      box.querySelector('.dlg-x').addEventListener('click', () => close(false));

    });
  }
  async function copyText(text, okMsg) {

  function renderOv() {

  function wireDetail(s, repo) {
    const nick = $('#nick');
    const saveNick = () => { if (nick.value.trim() !== (s.nick || '')) renameSession(s, nick.value); };
    nick.addEventListener('keydown', e => { if (e.key === 'Enter') { nick.blur(); } if (e.key === 'Escape') { nick.value = s.nick || ''; nick.blur(); } });
    nick.addEventListener('blur', saveNick);
    wireGroupPicker(s, repo);
    const newg = $('#newg');
    const add = () => { const n = newg.value.trim(); if (n) post('/api/assign', { key: s.key, repo: repo.key, group: n }); };
    $('#addg').addEventListener('click', add);
    newg.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });
    const rng = $('#rng'), rmg = $('#rmg');
    if (rng) rng.addEventListener('click', () => {
      askText({ title: 'Rename group “' + s.group + '”', value: s.group, ok: 'Rename' }).then(n => {
        if (n && n.trim() && n.trim() !== s.group) post('/api/group', { repo: repo.key, action: 'rename', name: s.group, new_name: n.trim() });
      });
    });
    if (rmg) rmg.addEventListener('click', () => {
      askConfirm('Delete group “' + s.group + '”?', 'Its sessions move back to Ungrouped (or their Orca workspace).', 'Delete group')
        .then(yes => { if (yes) post('/api/group', { repo: repo.key, action: 'remove', name: s.group }); });
    });
  }

  // compact group picker: one button + popover with a filterable, scrollable list
  function wireGroupPicker(s, repo) {
    const wrap = $('#gsel'), btn = $('#gselBtn'), pop = $('#gpop'), input = $('#gpopIn');
    const list = $('#gpopList'), empty = $('#gpopEmpty');
    if (!wrap) return;
    const names = ['', ...repo.group_names];
    const orcaAuto = (s.orca_workspace && s.group_source !== 'manual') ? s.orca_workspace : '';

    const match = (name, q) => !q || (name || 'ungrouped').toLowerCase().includes(q);
    const paint = () => {
      const q = input.value.trim().toLowerCase();
      const vis = names.filter(n => match(n, q));
      list.innerHTML = vis.map(name => {
        const on = (s.group || '') === name;
        return `<button type="button" class="gpop-i" role="option" data-assign="${esc(name)}" aria-selected="${on}"><span class="gname">${esc(name || 'Ungrouped')}</span>${orcaAuto && orcaAuto === name ? '<span class="tag orca" title="Orca workspace">🐋</span>' : ''}${on ? '<span class="tick" aria-hidden="true">✓</span>' : ''}</button>`;
      }).join('');
      empty.hidden = vis.length > 0;
      const cur = list.querySelector('[aria-selected=true]');
      if (cur) list.scrollTop = cur.offsetTop - list.clientHeight / 2 + cur.clientHeight / 2;
    };
    const setOpen = (on) => {
      wrap.classList.toggle('open', on);
      pop.hidden = !on;
      btn.setAttribute('aria-expanded', on ? 'true' : 'false');
      if (on) { input.value = ''; paint(); input.focus(); }
    };
    const choose = (name) => { setOpen(false); post('/api/assign', { key: s.key, repo: repo.key, group: name }); };

    btn.addEventListener('click', () => setOpen(pop.hidden));
    input.addEventListener('input', paint);
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        const vis = [...list.querySelectorAll('.gpop-i')];
        if (!vis.length) return;
        e.preventDefault();
        const i = vis.indexOf(document.activeElement);
        const n = e.key === 'ArrowDown' ? Math.min(vis.length - 1, i + 1) : Math.max(0, (i < 0 ? vis.length : i) - 1);
        vis[n].focus();
      } else if (e.key === 'Enter') {
        const first = list.querySelector('.gpop-i');
        if (first) { e.preventDefault(); choose(first.dataset.assign); }
      }
    });
    list.addEventListener('click', e => {
      const b = e.target.closest('[data-assign]');
      if (b) choose(b.dataset.assign);
    });

    const down = (e) => {
      if (!wrap.isConnected) { document.removeEventListener('mousedown', down, true); return; }
      if (pop.hidden || wrap.contains(e.target)) return;
      setOpen(false);
    };
    const key = (e) => {
      if (!wrap.isConnected) { document.removeEventListener('keydown', key, true); return; }
      if (e.key !== 'Escape' || pop.hidden) return;
      e.preventDefault(); e.stopPropagation();
      setOpen(false); btn.focus();
    };
    document.addEventListener('mousedown', down, true);
    document.addEventListener('keydown', key, true);
  }

  function render() { renderWin(); renderStatus(); renderChips(); warmOnIdle(); renderList(); renderDetail(false); }

  const narrow = () => matchMedia('(max-width: 760px)').matches;
  function select(key, fromUser) {

  // ---- events
  $('#main').addEventListener('click', e => {
    const a = e.target.closest('[data-ans]'); if (a) return answerDecision(a.dataset.ans, a.dataset.choice);

    if (o) { const box = o.closest('.dcard').querySelector('.dother'); box.hidden = false; box.querySelector('textarea').focus(); return; }
    const sd = e.target.closest('[data-send]');
    if (sd) { const t = sd.closest('.dother').querySelector('textarea'); if (!t.value.trim()) return t.focus(); return answerDecision(sd.dataset.send, 'other', t.value.trim()); }
    const cc = e.target.closest('[data-cancel]');
    if (cc) { const box = cc.closest('.dother'); box.querySelector('textarea').value = ''; box.hidden = true; }
    const ro = e.target.closest('[data-reopen]'); if (ro) return reopenDecision(ro.dataset.reopen);
  });
  $('#main').addEventListener('keydown', e => {
    const t = e.target.closest && e.target.closest('.dother textarea'); if (!t) return;

    if (e.key === 'Escape') t.closest('.dother').querySelector('[data-cancel]').click();

  document.addEventListener('click', e => { if (e.target.closest('[data-mback]')) { document.body.classList.remove('m-detail'); renderList(); } });
  $('#win').addEventListener('click', e => {

  $('#q').addEventListener('input', e => { ui.query = e.target.value; renderList(); });
  $('#hiddenBtn').addEventListener('click', () => { ui.showHidden = !ui.showHidden; renderList(); });
  // ---- three-dots menus
  const menuEl = document.createElement('div'); menuEl.id = 'menu'; menuEl.hidden = true; document.body.appendChild(menuEl);
  let menuAnchor = null, lastRect = null;
  function closeMenu() { menuEl.hidden = true; menuEl.style.maxHeight = menuEl.style.overflowY = ''; if (menuAnchor) menuAnchor.classList.remove('on'); menuAnchor = null; }
  function openMenu(anchor, items) {
    lastRect = anchor.getBoundingClientRect();
    closeMenu(); menuAnchor = anchor; anchor.classList.add('on');
    menuEl.innerHTML = ''; menuEl.style.width = '';
    for (const it of items) {
      if (it === '-') { const d = document.createElement('div'); d.className = 'sep'; menuEl.appendChild(d); continue; }
      if (it.hd) { const d = document.createElement('div'); d.className = 'hd'; d.textContent = it.hd; menuEl.appendChild(d); continue; }
      const b = document.createElement('button'); b.type = 'button'; b.textContent = it.label; if (it.danger) b.className = 'danger';
      b.addEventListener('click', ev => { ev.stopPropagation(); closeMenu(); it.fn(); });
      menuEl.appendChild(b);
    }
    menuEl.hidden = false;
    const r = anchor.isConnected ? anchor.getBoundingClientRect() : lastRect, mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
    menuEl.style.left = Math.max(8, Math.min(r.right - mw + 4, innerWidth - mw - 8)) + 'px';
    menuEl.style.top = Math.max(8, Math.min(r.bottom + 4, innerHeight - mh - 8)) + 'px';
  }
  document.addEventListener('click', e => { if (!menuEl.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
  $('#list').addEventListener('scroll', closeMenu);
  // ---- prefetch: warm conversations before they are clicked
  const itemByKey = (key) => { for (const r of tree.repos) for (const g of r.groups) for (const s of g.items) if (s.key === key) return s; return null; };
  const warm = (s) => { if (s && s.sid && !s.batch && window.NavChat && NavChat.prefetch) NavChat.prefetch(s.sid, s.engine); };
  let hoverT = null;
  document.addEventListener('mouseover', e => {
    const row = e.target.closest && e.target.closest('.s'); if (!row || !tree) return;
    clearTimeout(hoverT); hoverT = setTimeout(() => warm(itemByKey(row.dataset.key)), 90);
  });
  function warmNeighbours() {
    const i = flat.indexOf(ui.selected); if (i < 0) return;
    for (const k of [flat[i + 1], flat[i - 1], flat[i + 2]]) if (k) warm(itemByKey(k));
  }

      const n = params.count || (Array.isArray(params.keys) ? params.keys.length : 1);

    }
    if (action === 'unhide' || action === 'session.unhide') return 'Unhid items';
    if (action === 'decision.answer') return 'Answered a decision';
    if (action === 'decision.ask') return 'Asked you a decision';
    if (action === 'decision.reopen') return 'Reopened a decision';
    if (action === 'undo') return 'Undid a change';
    if (action === 'decision.rank') return 'Ranked the top decisions';
    if (action === 'order.repos') return 'Reordered projects';
    if (action === 'order.groups') return 'Reordered groups';

    if (t) { const k = t.dataset.toggle; ui.collapsed[k] = !ui.collapsed[k]; store.set('collapsed', ui.collapsed); renderList(); }
  });
  $('#list').addEventListener('dblclick', e => {
    const s = e.target.closest('.s'); if (!s) return;
    select(s.dataset.key); const n = $('#nick'); if (n) { n.focus(); n.select(); }
  });

  // drag a session onto a group header (same repo) to file it; also drag projects/groups to reorder
  let dragKey = null, dragRepo = null, dragType = null, dragRepoKey = null, dragGroupName = null;
  function clearDragMarkers() {
    document.querySelectorAll('.grp-h.drop,.ungrouped.drop,.repo-h.drop-above,.repo-h.drop-below,.grp-h.drop-above,.grp-h.drop-below').forEach(x => {
      x.classList.remove('drop','drop-above','drop-below');
    });
  }
  $('#list').addEventListener('dragstart', e => {
    const rh = e.target.closest('.repo-h');
    if (rh && rh.dataset.repoHeader && !e.target.closest('.dots,.eye,.star-b')) {
      dragType = 'repo'; dragRepoKey = rh.dataset.repoHeader; dragKey = null; dragRepo = null;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/x-nav-repo', dragRepoKey); } catch(_){}
      try { e.dataTransfer.setData('text/plain', dragRepoKey); } catch(_){}
      return;
    }
    const gh = e.target.closest('.grp-h');
    if (gh && gh.dataset.grp && gh.dataset.repoKey && !e.target.closest('.dots,.eye,.star-b')) {
      dragType = 'group'; dragRepoKey = gh.dataset.repoKey; dragGroupName = gh.dataset.grp; dragKey = null; dragRepo = null;
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/x-nav-group', dragRepoKey + '|' + dragGroupName); } catch(_){}
      try { e.dataTransfer.setData('text/plain', dragGroupName); } catch(_){}
      return;
    }
    const s = e.target.closest('.s'); if (!s) return;
    dragType = 'session'; dragKey = s.dataset.key; dragRepo = s.dataset.repo;
    e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragKey); } catch(_){}
  });
  $('#list').addEventListener('dragover', e => {
    if (dragType === 'repo') {
      const rh = e.target.closest('.repo-h');
      if (rh && rh.dataset.repoHeader && rh.dataset.repoHeader !== dragRepoKey) {
        e.preventDefault(); e.stopPropagation();
        clearDragMarkers();
        const rect = rh.getBoundingClientRect();
        if (e.clientY < rect.top + rect.height/2) rh.classList.add('drop-above'); else rh.classList.add('drop-below');
        return;
      }
      return;
    }
    if (dragType === 'group') {
      const gh = e.target.closest('.grp-h');
      if (gh && gh.dataset.grp && gh.dataset.repoKey === dragRepoKey && gh.dataset.grp !== dragGroupName) {
        e.preventDefault(); e.stopPropagation();
        clearDragMarkers();
        const rect = gh.getBoundingClientRect();
        if (e.clientY < rect.top + rect.height/2) gh.classList.add('drop-above'); else gh.classList.add('drop-below');
        return;
      }
      return;
    }
    const h = e.target.closest('[data-drop-repo]');
    clearDragMarkers();
    if (h && dragKey && h.dataset.dropRepo === dragRepo) { e.preventDefault(); h.classList.add('drop'); }
  });
  $('#list').addEventListener('drop', e => {
    if (dragType === 'repo') {
      const rh = e.target.closest('.repo-h');
      if (rh && rh.dataset.repoHeader && rh.dataset.repoHeader !== dragRepoKey) {
        e.preventDefault(); e.stopPropagation();
        clearDragMarkers();
        const rect = rh.getBoundingClientRect();
        const keys = getRepoOrderKeys();
        const arr = keys.slice();
        const from = arr.indexOf(dragRepoKey);
        const toIdx = arr.indexOf(rh.dataset.repoHeader);
        if (from >= 0 && toIdx >= 0) {
          arr.splice(from, 1);
          let insert = toIdx;
          if (e.clientY >= rect.top + rect.height/2) insert = toIdx + 1;
          if (from < toIdx) insert = insert - 1;
          if (insert < 0) insert = 0;
          arr.splice(insert, 0, dragRepoKey);
          // optimistic: reorder in tree
          const map = {};
          for (const r of tree.repos) map[r.key] = r;
          tree.repos = arr.map(k => map[k]).filter(Boolean).concat(tree.repos.filter(r => !arr.includes(r.key)));
          renderList();
          post('/api/order', { kind: 'repos', keys: arr }).then(()=>refresh(true)).catch(()=>refresh(true));
        }
        dragType=null; dragRepoKey=null; return;
      }
      dragType=null; dragRepoKey=null; clearDragMarkers(); return;
    }
    if (dragType === 'group') {
      const gh = e.target.closest('.grp-h');
      if (gh && gh.dataset.grp && gh.dataset.repoKey === dragRepoKey && gh.dataset.grp !== dragGroupName) {
        e.preventDefault(); e.stopPropagation();
        clearDragMarkers();
        const rect = gh.getBoundingClientRect();
        const repo = tree.repos.find(r=>r.key===dragRepoKey);
        if (repo) {
          const names = getGroupOrderKeys(repo);
          const arr = names.slice();
          const from = arr.indexOf(dragGroupName);
          const toIdx = arr.indexOf(gh.dataset.grp);
          if (from >= 0 && toIdx >= 0) {
            arr.splice(from, 1);
            let insert = toIdx;
            if (e.clientY >= rect.top + rect.height/2) insert = toIdx + 1;
            if (from < toIdx) insert = insert - 1;
            if (insert < 0) insert = 0;
            arr.splice(insert, 0, dragGroupName);
            // optimistic reorder groups in repo
            const gmap = {};
            for (const g of repo.groups) gmap[g.name] = g;
            repo.groups = arr.map(n=>gmap[n]).filter(Boolean).concat(repo.groups.filter(g=>!arr.includes(g.name)));
            renderList();
            post('/api/order', { kind: 'groups', repo: dragRepoKey, names: arr }).then(()=>refresh(true)).catch(()=>refresh(true));
          }
        }
        dragType=null; dragRepoKey=null; dragGroupName=null; return;
      }
      dragType=null; dragRepoKey=null; dragGroupName=null; clearDragMarkers(); return;
    }
    const h = e.target.closest('[data-drop-repo]'); if (!h || !dragKey) return;
    e.preventDefault(); h.classList.remove('drop');
    if (h.dataset.dropRepo === dragRepo) post('/api/assign', { key: dragKey, repo: dragRepo, group: h.dataset.dropGroup });
    dragKey = null; dragType=null;
  });
  $('#list').addEventListener('dragend', () => { dragKey = null; dragRepo=null; dragType=null; dragRepoKey=null; dragGroupName=null; clearDragMarkers(); });

  function moveRepoBy(dir, key) {   // key from the ⋯ menu; without it, the focused header (Alt+Arrow)
    const keys = getRepoOrderKeys();
    const el = document.activeElement;
    const rh = !key && el && el.closest ? el.closest('.repo-h') : null;
    const k = key || (rh && rh.dataset.repoHeader);
    if (!k) return;
    const arr = keys.slice();
    const i = arr.indexOf(k);
    if (i < 0) return;
    const j = dir === 'up' ? i-1 : i+1;
    if (j < 0 || j >= arr.length) return;
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    const map = {};
    for (const r of tree.repos) map[r.key] = r;
    tree.repos = arr.map(x=>map[x]).filter(Boolean).concat(tree.repos.filter(r=>!arr.includes(r.key)));
    renderList();
    setTimeout(()=>{
      const nh = document.querySelector('.repo-h[data-repo-header="'+CSS.escape(k)+'"]');
      if (nh) { nh.focus(); nh.scrollIntoView({block:'nearest'}); }
    }, 0);
    post('/api/order', { kind: 'repos', keys: arr }).then(()=>refresh(true)).catch(()=>refresh(true));
  }
  function moveGroupBy(dir, repoKey, name) {   // from the ⋯ menu; without them, the focused header (Alt+Arrow)
    const el = document.activeElement;
    const gh = !repoKey && el && el.closest ? el.closest('.grp-h') : null;
    const rk = repoKey || (gh && gh.dataset.repoKey);
    const k = repoKey ? name : (gh && gh.dataset.grp);
    if (!rk || !k) return;
    const repo = tree.repos.find(r=>r.key===rk);
    if (!repo) return;
    const names = getGroupOrderKeys(repo);
    const arr = names.slice();
    const i = arr.indexOf(k);
    if (i < 0) return;
    const j = dir === 'up' ? i-1 : i+1;
    if (j < 0 || j >= arr.length) return;
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    const gmap = {};
    for (const g of repo.groups) gmap[g.name] = g;
    repo.groups = arr.map(x=>gmap[x]).filter(Boolean).concat(repo.groups.filter(g=>!arr.includes(g.name)));
    renderList();
    setTimeout(()=>{
      const nh = document.querySelector('.grp-h[data-grp="'+CSS.escape(k)+'"][data-repo-key="'+CSS.escape(repo.key)+'"]');
      if (nh) { nh.focus(); nh.scrollIntoView({block:'nearest'}); }
    }, 0);
    post('/api/order', { kind: 'groups', repo: repo.key, names: arr }).then(()=>refresh(true)).catch(()=>refresh(true));
  }

  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus(); return; }
    if (e.key === 'Escape' && document.activeElement === $('#q')) { $('#q').value = ''; ui.query = ''; $('#q').blur(); renderList(); return; }
    if (typing && document.activeElement !== $('#q')) return;
    if (e.altKey && !e.shiftKey && !e.metaKey && !e.ctrlKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      const el = document.activeElement;
      if (el && (el.classList.contains('repo-h') || el.closest('.repo-h'))) { e.preventDefault(); moveRepoBy(e.key === 'ArrowUp' ? 'up' : 'down'); return; }
      if (el && (el.classList.contains('grp-h') || el.closest('.grp-h'))) { e.preventDefault(); moveGroupBy(e.key === 'ArrowUp' ? 'up' : 'down'); return; }
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!flat.length) return;
      e.preventDefault();
      const i = flat.indexOf(ui.selected);
      const n = e.key === 'ArrowDown' ? Math.min(flat.length - 1, i + 1) : Math.max(0, (i < 0 ? flat.length : i) - 1);
      select(flat[n]);
    } else if (e.key === 'Enter' && !typing) {
      const hit = findSel(); if (hit && (hit.s.open_url || hit.s.engine === 'pi')) { ui.pane = 'chat'; store.set('pane', 'chat'); renderDetail(true); }
    } else if (e.key === 'r' && !typing && !e.metaKey && !e.ctrlKey) {
      const n = $('#nick'); if (n) { e.preventDefault(); n.focus(); n.select(); }
    }
  });

  renderWin();
  // ---- versions: the page knows which build it is; every 15 minutes it asks the server for the current one
  const APP_VERSION = '__NAV_VERSION__';
  const upd = { latest: APP_VERSION, checked: 0, checking: false };
  async function checkUpdate(manual) {
    if (upd.checking) return;
    upd.checking = true; renderDrawer();
    try {
      const r = await fetch('/api/version', { cache: 'no-store' });
      upd.latest = (await r.json()).version || upd.latest; upd.checked = Date.now();
      if (upd.latest !== APP_VERSION) {
        if (document.hidden) return location.reload();   // nobody is looking: just take it
        toast('A new version is ready', { label: 'Update', fn: () => location.reload(), sticky: true });
      } else if (manual) toast('You have the latest version');
    } catch (_) { if (manual) toast('Could not check for updates'); }
    finally { upd.checking = false; renderDrawer(); }
  }
  setInterval(checkUpdate, 15 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - upd.checked > 15 * 60 * 1000) checkUpdate(); });
  setTimeout(checkUpdate, 3000);

  function renderDrawer() {
    const d = $('#drawer'); if (!d) return;
    const fresh = upd.latest !== APP_VERSION;
    $('#updDot').hidden = !fresh;
    const at = upd.checked ? new Date(upd.checked).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'not yet';
    const mine = tree ? (tree.user_hidden || 0) : 0;
    d.innerHTML = `<h3>Navigator</h3>
      <div class="dv">Version ${esc(APP_VERSION)}${fresh ? ' · <b>' + esc(upd.latest) + ' is ready</b>' : ''}<br>Last checked ${esc(at)} · checks every 15 min</div>
      ${fresh ? '<button type="button" class="it hl" data-dr="reload">Update now</button>' : ''}
      <button type="button" class="it" data-dr="check">${upd.checking ? 'Checking…' : 'Check for update'}</button>
      <button type="button" class="it" data-dr="mine">${ui.showMine ? 'Hide what I hid' : 'Show what I hid'}<span>${mine}</span></button>
      <button type="button" class="it" data-dr="bg">${ui.showHidden ? 'Hide background runs list' : 'Show background runs list'}</button>
      <button type="button" class="it" data-dr="dgroups">Claude desktop groups…</button>
      <button type="button" class="it" data-dr="copilot">Co-pilot session…</button>
      <button type="button" class="it" data-dr="changes">Recent changes…</button>
      <div class="rh"><div class="rht">Recently hidden</div><div id="hideLog" class="dv">Loading…</div></div>
      <div class="hint">Hid something by mistake? Tap <b>Show what I hid</b>: hidden items come back dimmed. Tap the eye on one to unhide it. Right after hiding, the <b>Undo</b> at the bottom also works.</div>`;
  }
  async function loadHideLog() {
    const box = $('#hideLog'); if (!box) return;
    const r = await fetch('/api/hidelog', { cache: 'no-store' }).then(x => x.json()).catch(() => ({ entries: [] }));
    const es = r.entries || [];
    box.innerHTML = es.length ? es.slice(0, 8).map(e => `<div class="hl-row"><span title="${esc(e.label || e.keys.join(', '))}">${esc(e.label || (e.keys.length + ' items'))}<i>${ago(e.ts)}</i></span><button type="button" data-undo="${esc(e.id)}">Undo</button></div>`).join('')
      : 'Nothing hidden recently.';
  }
  const openDrawer = (on) => { document.body.classList.toggle('drawer-open', on); if (on) { renderDrawer(); loadHideLog(); } };
  $('#menuBtn').addEventListener('click', e => { e.stopPropagation(); openDrawer(!document.body.classList.contains('drawer-open')); });
  $('#drawerScrim').addEventListener('click', () => openDrawer(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('drawer-open')) openDrawer(false); });
  $('#drawer').addEventListener('click', e => {
    const u = e.target.closest('[data-undo]'); if (u) { u.disabled = true; return undoHide(u.dataset.undo).then(loadHideLog); }
    const b = e.target.closest('[data-dr]'); if (!b) return;
    const a = b.dataset.dr;
    if (a === 'dgroups') { openDrawer(false); return desktopGroups(); }
    if (a === 'copilot') { openDrawer(false); return openCopilotDialog(); }
    if (a === 'changes') { return openRecentChanges(); }
    if (a === 'check') return checkUpdate(true);
    if (a === 'reload') return location.reload();
    if (a === 'mine') { ui.showMine = !ui.showMine; store.set('showMine', ui.showMine); openDrawer(false); return refresh(true); }
    if (a === 'bg') { ui.showHidden = !ui.showHidden; openDrawer(false); return renderList(); }
  });

  ui.focus = parseHash();
  window.addEventListener('hashchange', () => { ui.focus = parseHash(); refresh(true); });
  refresh(true);
  setInterval(() => { if (!document.hidden) refresh(false); }, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(false); });
})();
</script>
</body>
</html>
